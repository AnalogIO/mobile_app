name: cafe_analog_app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  # Run on every pull request, including stacked ones whose base is another
  # feature branch.
  pull_request:

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v2

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_channel: stable
      flutter_version: 3.47.7
      # Coverage floor. Raise this as tests are added; the current baseline is
      # just above 20% (mostly auth and router tests).
      min_coverage: 20

  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Debug builds need no signing secrets. Building both flavors catches
      # flavor-specific Gradle/manifest/applicationId regressions.
      - name: Build development APK
        run: flutter build apk --flavor development --debug
      - name: Build production APK
        run: flutter build apk --flavor production --debug
      # Also exercise R8/minification. This uses a throwaway debug keystore so
      # release-only breakages (missing ProGuard rules, stripping failures) are
      # caught without exposing the production signing secrets to PRs.
      - name: Create throwaway debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/debug.keystore
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          EOF
      - name: Build development release APK
        run: flutter build apk --flavor development --release

  ios-build:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Simulator builds do not need signing certificates, but still validate
      # the Xcode project, bundle identifiers, flavors and Swift/plugin setup.
      - name: Build development app for simulator
        run: flutter build ios --simulator --flavor development
      - name: Build production app for simulator
        run: flutter build ios --simulator --flavor production

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v2
    with:
      includes: |
        **/*.md
      modified_files_only: false
