name: cafe_analog_app
description: A coffeecard app for Café Analog.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  bloc: ^9.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.1.1
  intl: ^0.20.2
  analog_api:
    path: packages/analog_api
  dio: ^5.11.1
  tonik_util: ^0.11.0
  fpdart: ^1.1.1
  logger: ^2.6.2
  equatable: ^3.0.0
  gap: ^3.0.1
  dotted_border: ^3.1.0
  flutter_secure_storage: ^11.0.0
  collection: ^1.19.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  confetti: ^0.8.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^11.0.0
  tonik: ^0.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/profile_icons/
